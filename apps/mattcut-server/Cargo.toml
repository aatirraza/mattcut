[package]
name = "mattcut-server"
description = "MattCut team server: accounts (email + Google), sessions, shared projects and edit locks"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
mattcut-office = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
tiny_http = "0.12"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
